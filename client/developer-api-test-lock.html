<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f1e8">
    <title>API test access | Z Namibia</title>
    <style>
        :root { color-scheme: light; --ink: #17231e; --muted: #68736d; --paper: #f4f1e8; --white: #fffefa; --forest: #18382e; --red: #8b3b2f; --line: #d9d9cf; }
        * { box-sizing: border-box; }
        body { display: grid; min-height: 100vh; margin: 0; padding: 20px; place-items: center; color: var(--ink); background: var(--paper); font-family: "Trebuchet MS", "Segoe UI", sans-serif; }
        main { width: min(100%, 430px); padding: 28px; border: 1px solid var(--line); background: var(--white); }
        .eyebrow { color: var(--forest); font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
        h1 { margin: 8px 0; font: 400 34px Georgia, serif; }
        p { color: var(--muted); font-size: 12px; line-height: 1.65; }
        form { display: grid; gap: 12px; margin-top: 20px; }
        label { display: grid; gap: 6px; font-size: 11px; font-weight: 700; }
        input, button { min-height: 42px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 3px; font: inherit; }
        button { border-color: var(--forest); color: var(--white); background: var(--forest); cursor: pointer; font-size: 11px; font-weight: 700; }
        button:disabled { opacity: .6; cursor: wait; }
        .status { min-height: 18px; color: var(--red); }
        a { color: var(--forest); font-size: 11px; font-weight: 700; }
    </style>
</head>
<body>
    <main>
        <p class="eyebrow">Super Admin tool</p>
        <h1>API test client</h1>
        <p>This test client is restricted to signed-in Super Admins. Enter the access password to continue.</p>
        <form id="unlock-form">
            <label for="password">Password
                <input id="password" name="password" type="password" autocomplete="current-password" required>
            </label>
            <button id="unlock-button" type="submit">Unlock test client</button>
        </form>
        <p class="status" id="status" role="status" aria-live="polite"></p>
        <a href="/developers">Back to Developer API</a>
    </main>
    <script>
        const form = document.querySelector("#unlock-form");
        const button = document.querySelector("#unlock-button");
        const status = document.querySelector("#status");
        const handoff = new URLSearchParams(window.location.hash.slice(1));
        const handoffAppId = handoff.get("appId") || "";
        const handoffApiToken = handoff.get("apiToken") || "";
        if (window.location.hash) history.replaceState(null, "", window.location.pathname + window.location.search);

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            if (!form.reportValidity()) return;
            button.disabled = true;
            status.textContent = "Checking password…";
            try {
                const response = await fetch("/api/developer-api-test/unlock", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ password: new FormData(form).get("password") })
                });
                let result;
                try {
                    result = await response.json();
                } catch {
                    throw new Error("The access service returned an invalid response.");
                }
                if (!response.ok) throw new Error(result.error || "Could not unlock the test client.");
                const credentials = new URLSearchParams();
                if (/^[\da-f-]{36}$/i.test(handoffAppId) && /^zstmt_live_[A-Za-z0-9_-]{43}$/.test(handoffApiToken)) {
                    credentials.set("appId", handoffAppId);
                    credentials.set("apiToken", handoffApiToken);
                }
                window.location.replace(`/developer-api-test${credentials.size ? `#${credentials.toString()}` : ""}`);
            } catch (error) {
                status.textContent = error.message || "Could not unlock the test client.";
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
