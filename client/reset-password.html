<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f1e8">
    <title>Reset password | Z</title>
    <style>
        :root { color-scheme: light; --ink: #17231e; --muted: #69736d; --paper: #f4f1e8; --white: #fffefa; --lime: #d8f36a; --line: #d8d8ce; --forest: #397d54; }
        * { box-sizing: border-box; }
        body { display: grid; min-width: 320px; min-height: 100vh; margin: 0; place-items: center; padding: 24px; color: var(--ink); background: var(--paper); font-family: "Trebuchet MS", "Segoe UI", sans-serif; }
        .reset-panel { width: min(100%, 460px); padding: 38px; border: 1px solid var(--line); background: var(--white); }
        .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 32px; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
        .brand-mark { display: grid; width: 36px; aspect-ratio: 1; place-items: center; border: 1.5px solid var(--ink); border-radius: 50%; font-family: Georgia, serif; font-size: 22px; }
        .eyebrow { margin: 0 0 10px; color: var(--forest); font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
        h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 36px; font-weight: 400; }
        .intro { margin: 10px 0 25px; color: var(--muted); font-size: 13px; line-height: 1.6; }
        form { display: grid; gap: 16px; }
        label { display: grid; gap: 7px; font-size: 12px; font-weight: 700; }
        input { width: 100%; height: 48px; padding: 0 12px; border: 1px solid var(--line); border-radius: 3px; color: var(--ink); background: var(--white); font: inherit; }
        input:focus-visible { outline: 2px solid var(--forest); outline-offset: 2px; }
        button { display: flex; min-height: 50px; align-items: center; justify-content: space-between; padding: 0 15px; border: 1px solid var(--ink); border-radius: 3px; color: var(--white); background: var(--ink); cursor: pointer; font-size: 12px; font-weight: 700; }
        button:hover { color: var(--ink); background: var(--lime); }
        button:disabled { opacity: .6; cursor: wait; }
        .message { min-height: 20px; margin: 12px 0 0; color: #8b3b2f; font-size: 12px; line-height: 1.5; }
        .message.success { color: var(--forest); }
        .message a, .back-link { color: var(--forest); font-weight: 700; }
        .back-link { display: inline-block; margin-top: 20px; font-size: 12px; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
        @media (max-width: 480px) { .reset-panel { padding: 28px 22px; } h1 { font-size: 32px; } }
    </style>
</head>
<body>
    <main class="reset-panel">
        <div class="brand"><span class="brand-mark" aria-hidden="true">Z</span><span>Good things start here</span></div>
        <p class="eyebrow">Account access</p>
        <h1>Choose a new password</h1>
        <p class="intro">Reset links are valid for 15 minutes and can only be used once.</p>
        <form id="reset-form">
            <label for="new-password">New password
                <input id="new-password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
            </label>
            <label for="confirm-password">Confirm new password
                <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
            </label>
            <button type="submit"><span>Reset password</span><span aria-hidden="true">&#8594;</span></button>
        </form>
        <p class="message" id="reset-message" role="status" aria-live="polite"></p>
        <a class="back-link" href="/login">Back to sign in</a>
    </main>
    <script>
        const form = document.querySelector("#reset-form");
        const password = document.querySelector("#new-password");
        const confirmation = document.querySelector("#confirm-password");
        const submit = form.querySelector("button[type='submit']");
        const message = document.querySelector("#reset-message");
        const token = new URLSearchParams(window.location.search).get("token") || "";

        if (!/^[a-f0-9]{64}$/.test(token)) {
            form.hidden = true;
            message.textContent = "This password reset link is invalid. Request a new link from the sign-in page.";
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            message.classList.remove("success");
            if (password.value !== confirmation.value) {
                message.textContent = "The passwords do not match.";
                confirmation.focus();
                return;
            }
            submit.disabled = true;
            message.textContent = "Updating your password...";
            try {
                const response = await fetch("/api/auth/reset-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token, password: password.value })
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || "Could not reset your password.");
                message.textContent = result.message || "Your password has been reset. Sign in with your new password.";
                message.classList.add("success");
                form.hidden = true;
            } catch (error) {
                message.textContent = error.message || "Could not reach Z. Check your connection and try again.";
                submit.disabled = false;
            }
        });
    </script>
</body>
</html>
